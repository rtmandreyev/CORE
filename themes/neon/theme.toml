[theme]
id = "neon"
name = "NODE // NEON"
mode = "dark"
slug = "node-neon"
brand = "NODE"
author = "Artyom Andreyev"
description = "Dense urban night-city instrumentation that still writes code: charcoal and near-black environment, high-legibility pale information, electric cyan signal, vivid yellow command material, restrained red faults and a single restrained magenta used only to separate syntax."

# ─────────────────────────────────────────────
# PALETTE — what colors exist.
# A charcoal night city rendered as instrumentation: near-black, cool, matte;
# information is pale and legible; the only electricity is cyan; yellow is a
# physical command material, not a text colour. Never rainbow neon, never
# everything glowing, never eye-searing saturation, never low-contrast yellow
# text (every yellow below is measured against the chassis it sits on).
# ─────────────────────────────────────────────
[palette]
# The material axis. `black*` is the CHASSIS (what an application is made of)
# and `white*` is INFORMATION (what is drawn on it); the role names below keep
# working across light and dark themes because they reference this axis, never a
# hue. Non-negotiable: cool charcoal, never warm brown or sepia.

# Charcoal environment.
black = "#0C0E12"
black_alt = "#14171C"

# Industrial raised material: panels, toolbars, insets.
black_raised = "#1B2026"

black_line = "#2B323A"

# Recessed code panel: charcoal, one step off the canvas.
black_panel = "#0A0C10"

# Pale information drawn on that material.
white = "#E6EDF2"
white_bright = "#F7FAFC"

# Structural gray.
gray = "#7E8B99"
gray_bright = "#A2AEBB"

# Electric cyan: `cyan` is dark enough to read as ink on charcoal,
# `cyan_bright` is the emitted/focus cyan (cursor, ornaments, accents) and
# `cyan_dim` is the dim cyan material used for selected surfaces, raised washes
# and hairlines that need to carry signal instead of gray.
cyan = "#2FD0E8"
cyan_bright = "#63E9F8"
cyan_dim = "#164A56"

# Yellow command family: `yellow` reads as standalone ink, `yellow_bright` is
# the physical command material a filled control is made of, `yellow_dim` is the
# dim yellow material used for highlights and tag chips.
yellow = "#F5C644"
yellow_bright = "#FFD95C"
yellow_dim = "#4A3A0F"

# Restrained magenta. It exists for ONE job — separating literals and constants
# from the yellow strings and the cyan keywords in a code block — so it appears
# in syntax mappings and nowhere else.
magenta = "#E070B8"

# Fault only.
red = "#F0665F"
red_bright = "#FF8B84"

# Cyan interaction/selection material.
selection = "#164A56"

# ─────────────────────────────────────────────
# ROLES — what those colors mean in this theme.
# ─────────────────────────────────────────────
[roles]
background = "black"
surface = "black_alt"
surface_raised = "black_raised"
border = "black_line"
border_emphasis = "cyan_dim"

text = "white"
text_emphasis = "white_bright"
text_muted = "gray_bright"

structure = "gray"
structure_emphasis = "gray_bright"

signal = "cyan"
signal_emphasis = "cyan_bright"
signal_dim = "cyan_dim"

command = "yellow"
command_emphasis = "yellow_bright"

# Filled controls. A control is a MATERIAL with a legend printed on it: the
# yellow is bright here, so the legend is the chassis colour, and a filled
# control never draws pale information on a bright fill.
command_material = "yellow_bright"
command_legend = "black"

fault = "red"
fault_emphasis = "red_bright"

selection = "selection"

[terminal]
foreground = "text"
background = "background"
cursor = "signal_emphasis"
selection_background = "selection"
selection_foreground = "text_emphasis"

[terminal.ansi]
# Mirrored for a dark chassis: ANSI black is the material the terminal is made
# of, ANSI white is the information drawn on it.
black = "background"
red = "fault"
green = "signal"
yellow = "command"
blue = "structure_emphasis"
magenta = "gray_bright"
cyan = "signal"
white = "text"

bright_black = "structure"
bright_red = "fault_emphasis"
bright_green = "signal_emphasis"
bright_yellow = "command_emphasis"
bright_blue = "text_muted"
bright_magenta = "gray_bright"
bright_cyan = "signal_emphasis"
bright_white = "text_emphasis"

# ─────────────────────────────────────────────
# PROMPT — approved Starship semantics.
# NODE white / // gray / directory cyan / branch white /
# status yellow / arrow cyan / errors red.
# ─────────────────────────────────────────────
[prompt]
frame = "structure"
brand = "text_emphasis"
separator = "structure"
directory = "signal_emphasis"
git_branch = "text_emphasis"
git_status = "command_emphasis"
runtime = "command_emphasis"
environment = "signal_emphasis"
success = "signal_emphasis"
error = "fault_emphasis"
vim_command = "command_emphasis"

# ─────────────────────────────────────────────
# APP MAPPINGS — application-specific assignments.
# Application-specific KEYS live here, application-specific STRUCTURE lives in
# the templates. A future theme changes these values without touching Python.
# ─────────────────────────────────────────────

[apps.fastfetch]
header = "NEON"
title = "text_emphasis"
separator = "structure"
label = "structure_emphasis"
value = "text"
healthy = "signal_emphasis"
status = "command_emphasis"
fault = "fault_emphasis"
# Yellow frequency: a small command/state control line and a state badge, not a
# yellow panel. Fastfetch keeps pale values, gray structure and cyan health.
rule = "command"
badge = "command_emphasis"

[apps.vscode]
# Structure
canvas = "background"
surface = "surface"
surface_raised = "surface_raised"
border = "border"
border_emphasis = "border_emphasis"
# Information
body = "text"
strong = "text_emphasis"
metadata = "structure"
metadata_emphasis = "structure_emphasis"
comment = "structure"
# Interaction
cursor = "signal_emphasis"
focus = "signal"
accent = "signal"
accent_strong = "signal_emphasis"
selection = "selection"
selection_foreground = "text_emphasis"
selection_highlight = "signal_dim"
# State
modified = "command"
warning = "command_emphasis"
error = "fault"
error_strong = "fault_emphasis"
success = "signal"
# Yellow frequency: small badges and warning indicators carry the command
# material where it means state, so ordinary editing surfaces stay charcoal.
badge = "command_material"
badge_text = "command_legend"
# Syntax. Cyan keywords, pale names, yellow literals: a code block is readable
# before it is colourful. Magenta appears here and only here, to keep numeric
# literals and constants apart from the yellow strings.
keyword = "signal"
function = "text_emphasis"
string = "command"
number = "magenta"
constant = "magenta"
type = "signal_emphasis"
variable = "text"
parameter = "text"
operator = "text_muted"
tag = "signal"
attribute = "command"
invalid = "fault_emphasis"

# The CLI skin and the Desktop theme are the SAME artifact: the desktop
# converts the active backend skin into a DesktopTheme
# (apps/desktop/src/themes/skin.ts). Keys below marked (desktop) are read by
# that converter; the rest are the CLI contract.
[apps.hermes]
background = "background"        # (desktop) GUI canvas opt-in
status_bar_bg = "surface"        # (desktop) backdrop fallback
ui_text = "text"                 # (desktop) foreground seed
banner_text = "text_emphasis"    # (desktop) foreground seed
ui_accent = "signal_emphasis"    # (desktop) accent / midground / focus / selection accent
banner_accent = "signal"
ui_border = "border"             # (desktop) hairlines
banner_border = "border"
banner_title = "text_emphasis"
banner_dim = "text_muted"        # (desktop) muted foreground / CLI dim
ui_label = "structure_emphasis"
ui_ok = "signal"
ui_error = "fault"               # (desktop) destructive
ui_warn = "command"
session_border = "signal"        # (desktop) muted foreground
session_label = "command"

prompt = "text_emphasis"
input_rule = "signal"
response_border = "signal"

status_bar_text = "text"
status_bar_strong = "text_emphasis"
status_bar_dim = "text_muted"
status_bar_good = "signal"
status_bar_warn = "command"
status_bar_bad = "fault"
status_bar_critical = "fault_emphasis"

completion_menu_bg = "surface"           # (desktop) input fill
completion_menu_current_bg = "signal_dim"
completion_menu_meta_bg = "surface"
completion_menu_meta_current_bg = "signal_dim"
selection_bg = "selection"

shell_dollar = "command"
voice_status_bg = "surface"

# Yellow frequency: small persistent CLI markers (the prompt sigil and session
# labels) carry the command colour; message text, canvas and focus stay as they
# are, and focus/active semantics remain cyan.

[apps.obsidian]
# Structure
canvas = "background"
surface = "surface"
surface_2 = "surface"
surface_3 = "surface_raised"
border = "border"
border_bright = "signal"
# Information
body = "text"
strong = "text_emphasis"
muted = "text_muted"
dim = "structure"
# Interaction
accent = "signal"
accent_bright = "signal_emphasis"
accent_dim = "signal_dim"
hover = "surface_raised"
active = "selection"
selection = "selection"
selection_foreground = "text_emphasis"
# Semantic state
success = "signal"
success_bright = "signal_emphasis"
warning = "command"
warning_bright = "command_emphasis"
error = "fault"
error_bright = "fault_emphasis"
highlight = "text_emphasis"
highlight_bg = "yellow_dim"
# Code: the recessed charcoal panel carries the same information inks the
# canvas does.
code_bg = "black_panel"
code_text = "text_emphasis"
code_keyword = "signal"
code_string = "command"
code_number = "magenta"
code_function = "text_emphasis"
code_comment = "structure"
# Headings: a pale/cyan hierarchy, not a rainbow.
heading_1 = "text_emphasis"
heading_2 = "text"
heading_3 = "signal"
heading_4 = "text_emphasis"
heading_5 = "structure_emphasis"
heading_6 = "structure"
# Tags / navigation
# Yellow frequency: wiki tags and task checkboxes are the small persistent
# controls users actually look at, so they carry the dim yellow material at chip
# size with a pale legend. Body text, navigation and canvas stay pale on
# charcoal.
tag_bg = "yellow_dim"
tag_text = "text_emphasis"
link = "signal"
link_bright = "signal_emphasis"
scrollbar = "surface_raised"
checkbox = "signal_dim"
# Small yellow metadata markers rather than yellow metadata text.
heading_ornament = "command"
metadata_icon = "command"
metadata_add = "command"

# ─────────────────────────────────────────────
# OBSIDIAN — code tokens and application chrome.
#
# Obsidian's own stylesheet (verified against Obsidian 1.13.7 app.css) colours
# every fenced-code token from a `--code-*` variable and nothing else:
#   .cm-keyword  -> var(--code-keyword)     .cm-string   -> var(--code-string)
#   .cm-number   -> var(--code-value)       .cm-builtin,
#   .cm-comment  -> var(--code-comment)     .cm-property,
#   .cm-punctuation, .cm-bracket,           .cm-attribute,
#   .cm-hr       -> var(--code-punctuation) .cm-type     -> var(--code-function)
#   .token.keyword / .token.string / .token.number … for the reading view.
# Every token that is drawn inside the recessed charcoal code panel is therefore
# one of the measured information inks: pale code, electric cyan keywords,
# yellow literals, restrained magenta numbers, structural gray comments, red
# faults. The emitted cyan and the bright yellow material are never used as
# body-prose text.
code_property = "text_emphasis"
code_punctuation = "text"
code_operator = "text_muted"
code_tag = "signal"
code_important = "command"
code_invalid = "fault"
code_border = "border"
code_bracket_bg = "selection"

# Obsidian application chrome. `chrome` is the chassis the shell is built from
# (titlebar, tab strip, ribbon, status bar, sidebar chrome); `chrome_alt` is the
# canvas the content surfaces sit on; `chrome_active` is a selected structural
# surface, which is the dim cyan material. Icons are structural gray at rest and
# readable cyan ink when active.
chrome = "surface"
chrome_alt = "background"
chrome_active = "selection"
icon = "text_muted"
icon_hover = "signal"
icon_active = "signal"

# Filled/selected controls: the bright yellow material carries the chassis
# colour as its legend. This pair is the contrast contract — `control_fill` is
# never paired with pale text, because the fill is the bright physical
# material.
control_fill = "command_material"
control_legend = "command_legend"

[apps.ghostty]
# Bold text uses the bright ANSI palette.
bold_color = "bright"
